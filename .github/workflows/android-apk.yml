
name: Build Market Pro APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android
        uses: android-actions/setup-android@v4

      - name: Extract project
        run: |
          unzip -q MarketPro.zip -d source

      - name: Fix Java and Kotlin targets
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("source/MarketPro/app/build.gradle.kts")
          s = p.read_text()

          marker = "    buildFeatures {"

          patch = """    compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

          """

          if "sourceCompatibility = JavaVersion.VERSION_17" not in s:
              if marker not in s:
                  raise SystemExit("Could not find buildFeatures in app/build.gradle.kts")
              s = s.replace(marker, patch + marker, 1)

          p.write_text(s)
          print("Java and Kotlin targets set to 17")
          PY

      - name: Build APK
        run: |
          cd source/MarketPro
          gradle --no-daemon :app:assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Market-Pro-APK
          path: source/MarketPro/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
